<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | IP Address Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="inedx.css">
</head>
<body>

    <main class="container">
        <section class="hero">
            <h1>IP Address Tracker</h1>
            <form class="search-form">
                <input type="text" id="search-input" placeholder="Search for any IP address or domain" required>
                <button type="submit" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="14"><path fill="none" stroke="#FFF" stroke-width="3" d="M2 1l6 6-6 6"/></svg>
                </button>
            </form>

            <div class="stats-card">
                <div class="stat-item">
                    <h2>IP Address</h2>
                    <p id="ip-address">-</p>
                </div>
                <div class="stat-item">
                    <h2>Location</h2>
                    <p id="ip-location">-</p>
                </div>
                <div class="stat-item">
                    <h2>Timezone</h2>
                    <p id="ip-timezone">-</p>
                </div>
                <div class="stat-item">
                    <h2>ISP</h2>
                    <p id="ip-isp">-</p>
                </div>
            </div>
        </section>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="index.js"></script>
</body>
</html>
